<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#161b22; stroke:#2b3444; stroke-width:1.5; rx:10; }
      .accent { stroke:#3b82f6; }
      .title { fill:#e6edf3; font-weight:700; font-size:14px; }
      .sub { fill:#8b98a9; font-size:11px; }
      .tool { fill:#1c2330; stroke:#2b3444; stroke-width:1; }
      .tooltxt { fill:#22d3ee; font-family:ui-monospace, Menlo, monospace; font-size:11px; }
      .edge { stroke:#64748b; stroke-width:1.5; fill:none; }
      .lbl { fill:#8b98a9; font-size:10px; }
    </style>
  </defs>

  <rect width="760" height="520" fill="#0d1117"/>

  <!-- Browser -->
  <rect class="box" x="270" y="20" width="220" height="46" rx="10"/>
  <text class="title" x="380" y="40" text-anchor="middle">Browser · WebSocket chat</text>
  <text class="sub" x="380" y="56" text-anchor="middle">vanilla HTML / CSS / JS — no build step</text>

  <!-- Gateway -->
  <rect class="box accent" x="210" y="100" width="340" height="52" rx="10"/>
  <text class="title" x="380" y="122" text-anchor="middle">Flask API gateway</text>
  <text class="sub" x="380" y="140" text-anchor="middle">JWT auth · analyst/admin RBAC · rate limiting · /metrics</text>

  <!-- Agent core -->
  <rect class="box" x="180" y="186" width="400" height="60" rx="10"/>
  <text class="title" x="380" y="208" text-anchor="middle">ReAct agent core</text>
  <text class="sub" x="380" y="226" text-anchor="middle">Planner → Tool selector → Executor → Synthesizer</text>
  <text class="sub" x="380" y="240" text-anchor="middle">Anthropic Claude · deterministic fallback</text>

  <!-- Tools -->
  <rect x="60" y="286" width="640" height="120" rx="10" fill="#11161f" stroke="#2b3444" stroke-width="1.5"/>
  <text class="sub" x="72" y="304">grounded tools — each answer cites its source record</text>

  <g>
    <rect class="tool" x="72" y="316" width="150" height="34" rx="7"/>
    <text class="tooltxt" x="147" y="337" text-anchor="middle">search_incidents</text>
    <rect class="tool" x="232" y="316" width="150" height="34" rx="7"/>
    <text class="tooltxt" x="307" y="337" text-anchor="middle">lookup_cve</text>
    <rect class="tool" x="392" y="316" width="150" height="34" rx="7"/>
    <text class="tooltxt" x="467" y="337" text-anchor="middle">correlate_events</text>
    <rect class="tool" x="552" y="316" width="136" height="34" rx="7"/>
    <text class="tooltxt" x="620" y="337" text-anchor="middle">mitre_lookup</text>

    <rect class="tool" x="152" y="360" width="150" height="34" rx="7"/>
    <text class="tooltxt" x="227" y="381" text-anchor="middle">geoip_enrich</text>
    <rect class="tool" x="312" y="360" width="150" height="34" rx="7"/>
    <text class="tooltxt" x="387" y="381" text-anchor="middle">suggest_playbook</text>
  </g>

  <!-- Memory + observability -->
  <rect class="box" x="120" y="440" width="240" height="52" rx="10"/>
  <text class="title" x="240" y="462" text-anchor="middle">Session memory</text>
  <text class="sub" x="240" y="480" text-anchor="middle">Redis (24h TTL) → in-memory fallback</text>

  <rect class="box" x="400" y="440" width="240" height="52" rx="10"/>
  <text class="title" x="520" y="462" text-anchor="middle">Observability</text>
  <text class="sub" x="520" y="480" text-anchor="middle">Prometheus metrics · JSON logs</text>

  <!-- Edges -->
  <path class="edge" d="M380,66 L380,98" marker-end="url(#arrow)"/>
  <path class="edge" d="M380,152 L380,184" marker-end="url(#arrow)"/>
  <path class="edge" d="M380,246 L380,284" marker-end="url(#arrow)"/>
  <path class="edge" d="M300,246 C300,420 240,410 240,438" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,246 C460,420 520,410 520,438" marker-end="url(#arrow)"/>

  <text class="lbl" x="388" y="84">real-time</text>
  <text class="lbl" x="388" y="172">authenticated request</text>
  <text class="lbl" x="388" y="270">tool calls</text>
</svg>
