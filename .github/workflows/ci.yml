name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Test (pytest + coverage)
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t soc-copilot:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name soc -p 8000:8000 -e SECRET_KEY=ci-test soc-copilot:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              echo "healthz OK"; curl -s http://localhost:8000/healthz; docker rm -f soc; exit 0
            fi
            sleep 2
          done
          echo "healthz never came up"; docker logs soc; docker rm -f soc; exit 1
